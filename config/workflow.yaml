# TypeWords 日报 Agent 运行参数
# 改动即时生效（每次 run.py 启动时读取）

word_source: new         # new = 今天要记的**新词**（App 同款算法：从 lastLearnIndex 起取 perDayStudyNumber 个，跳过已掌握）
                         # due = 记忆曲线到期复习词（旧行为，配 exclude_known 使用）
max_words: 20            # 单次讲义最多收录多少个词（超出按顺序截断）
print: true              # 生成后推送打印
mark_known: false        # 打印后是否把当天收录的词标记为已掌握。新词流程必须 false：
                         # 标 known 会被 App 从「新词」里永久排除（且删掉 FSRS 卡），等于剥夺当天要学的词
exclude_known: true      # 仅 word_source=due 时生效：到期词里已 known 的跳过
print_retries: 2         # 收不到打印机回执时重发次数

pi:
  provider: qwen-maas             # 自定义 OpenAI 兼容端点（见 ~/.pi/agent/models.json）
  model: deepseek-v4.1-flash      # 该端点可用：deepseek-v4.1-flash | deepseek-v4-pro | qwen3.7-max
  thinking: low
  attempts: 2            # pi 创作尝试次数（含带反馈的重试）；仍失败则用例句兜底
  timeout_seconds: 900

print_ack_timeout: 45    # 下发后等待打印回执的秒数（无回执不算失败，只记 ack:null）
reader_skill: /root/.hermes/skills/margin-ruby-reader
print_skill_scripts: /root/.hermes/skills/productivity/print/scripts
print_config: config/print.yaml
template: assets/template.typ
fonts_dir: assets/fonts