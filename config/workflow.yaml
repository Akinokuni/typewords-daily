# TypeWords 日报 Agent 运行参数
# 改动即时生效（每次 run.py 启动时读取）

word_source: new+due     # new     = 今天要记的**新词**（App 同款算法：从 lastLearnIndex 起取
                         #           perDayStudyNumber 个，跳过已掌握 / 已学过的词）
                         # due     = 记忆曲线到期复习词
                         # new+due = 两者合并成**一份**讲义（默认：新词 + 到期复习词一起印）
max_words: 20            # 新词上限（超过按顺序截断）
max_due_words: 20        # 到期复习词上限
print: true              # 生成后推送打印
mark_known: false        # 打印后是否标记「掌握」。必须 false：标 known 会被 App 从新词池永久
                         # 排除，并删掉 FSRS 卡 —— 用户口径是「学了一遍」，不是「掌握」
study_record: true       # 打印成功后记录「学了一遍」= 写 FSRS 卡片（ts-fsrs 打分），
                         # 之后由 FSRS 到期时间把词推进「到期复习」，与新词一起印
study_rating: good       # 记录时的打分：good（认真过了一遍，无错）/ easy（很轻松，隔得久）/
                         # hard / again（第一次复习很快再见面）
advance_index: false     # 是否像 App 完成学习任务那样推进 lastLearnIndex。默认 false：
                         # 卡片本身就是「已学」标记，fetch_new 会跳过有卡片的词，不会重复推新词；
                         # 而推进进度可能与 App 自己完成学习任务时重复推进（跳过 20 个词）
exclude_known: true      # 已掌握的词不再进讲义（新词与到期词都跳过）
print_retries: 2         # 收不到打印机回执时重发次数

pi:
  provider: qwen-maas             # 自定义 OpenAI 兼容端点（见 ~/.pi/agent/models.json）
  model: deepseek-v4.1-flash      # 该端点可用：deepseek-v4.1-flash | deepseek-v4-pro | qwen3.7-max
  thinking: low
  attempts: 2            # pi 创作尝试次数（含带反馈的重试）；仍失败则用例句兜底
  timeout_seconds: 900

print_ack_timeout: 45    # 下发后等待打印回执的秒数（无回执不算失败，只记 ack:null）
reader_skill: /root/.hermes/skills/margin-ruby-reader
print_skill_scripts: /root/.hermes/skills/productivity/print/scripts
print_config: config/print.yaml
template: assets/template.typ
fonts_dir: assets/fonts